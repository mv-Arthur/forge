name: Iron Solver

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline stage to run
        required: true
        type: choice
        options:
          - develop
          - review
          - qa
      issue_number:
        description: Issue number for develop/qa
        required: false
        type: string
      pr_number:
        description: PR number for review
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  route:
    name: route
    runs-on: [self-hosted, forge-ai]
    concurrency:
      group: iron-solver-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || inputs.pr_number || github.run_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_HOME: ${{ runner.temp }}/codex-home
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      AI_PROJECT_KEY: ncottage-www
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infrastructure/run_iron_solver route
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iron-solver-${{ github.run_id }}
          path: |
            .iron-solver/ai-runs/**
            .iron-solver/chrome-checks/**
          if-no-files-found: ignore
