name: Preview release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/preview/package-lock.json

      - name: Install
        working-directory: apps/preview
        run: npm ci

      - name: Typecheck
        working-directory: apps/preview
        run: npm run typecheck

      - name: Lint
        working-directory: apps/preview
        run: npm run lint

      - name: Test
        working-directory: apps/preview
        run: npm test

      - name: Build
        working-directory: apps/preview
        run: npm run build

      - name: Assemble
        id: assemble
        working-directory: apps/preview
        run: echo "app=$(bash deploy/assemble.sh)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          APP: ${{ steps.assemble.outputs.app }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Add repository secret PREVIEW_SSH_KEY" >&2
            exit 1
          fi
          install -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/preview
          chmod 600 ~/.ssh/preview
          ssh-keyscan -H 83.222.24.12 >> ~/.ssh/known_hosts
          rsync -az --delete --exclude data \
            -e "ssh -i ~/.ssh/preview -o IdentitiesOnly=yes" \
            "apps/preview/${APP}/" \
            root@83.222.24.12:/opt/ncottage-preview/
          rsync -az --delete \
            -e "ssh -i ~/.ssh/preview -o IdentitiesOnly=yes" \
            apps/preview/data/fixtures/ \
            root@83.222.24.12:/opt/ncottage-preview/data/fixtures/
          ssh -i ~/.ssh/preview -o IdentitiesOnly=yes root@83.222.24.12 \
            "systemctl restart ncottage-preview && systemctl is-active ncottage-preview"
