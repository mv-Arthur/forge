server {
    listen 10.10.0.1:80;
    server_name testing.ncottage.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 10.10.0.1:443 ssl;
    server_name testing.ncottage.ru;

    ssl_certificate /etc/letsencrypt/live/testing.ncottage.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testing.ncottage.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /media/ {
        alias /opt/ncottage-preview/data/fixtures/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /_next/static/ {
        alias /opt/ncottage-preview/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
