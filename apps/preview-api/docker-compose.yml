services:
    postgres:
        image: postgres:16
        container_name: preview-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: preview
        ports:
            - "5433:5432"
        volumes:
            - preview-pgdata:/var/lib/postgresql/data

    mailpit:
        image: axllent/mailpit
        container_name: preview-mailpit
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"

volumes:
    preview-pgdata:
