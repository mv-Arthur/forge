services:
    postgres:
        image: postgres:16
        container_name: ncottage-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: ncottage
        ports:
            - "5432:5432"
        volumes:
            - ncottage-pgdata:/var/lib/postgresql/data

    minio:
        image: minio/minio
        container_name: ncottage-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - ncottage-minio:/data

volumes:
    ncottage-pgdata:
    ncottage-minio:
